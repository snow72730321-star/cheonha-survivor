<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="천하생존록 대장간 작업장">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#221d18"/><stop offset=".5" stop-color="#121310"/><stop offset="1" stop-color="#070907"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b4540"/><stop offset=".4" stop-color="#2a2925"/><stop offset="1" stop-color="#121311"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#adb4b1"/><stop offset=".18" stop-color="#505957"/><stop offset=".42" stop-color="#202625"/><stop offset=".72" stop-color="#7a8380"/><stop offset="1" stop-color="#141918"/></linearGradient>
 <linearGradient id="wood" x1="0" x2="1"><stop stop-color="#21110b"/><stop offset=".25" stop-color="#6a3c24"/><stop offset=".5" stop-color="#9b6037"/><stop offset=".72" stop-color="#5b321f"/><stop offset="1" stop-color="#1b0f09"/></linearGradient>
 <radialGradient id="fire" cx="50%" cy="55%" r="50%"><stop stop-color="#fffde0"/><stop offset=".1" stop-color="#ffe58a"/><stop offset=".28" stop-color="#ff9f35"/><stop offset=".52" stop-color="#d84416"/><stop offset=".8" stop-color="#5f140a" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <radialGradient id="amber" cx="50%" cy="50%"><stop stop-color="#ffcf6b" stop-opacity=".48"/><stop offset="1" stop-color="#d64d16" stop-opacity="0"/></radialGradient>
 <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter><filter id="blur35"><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="brick" width="150" height="72" patternUnits="userSpaceOnUse"><rect width="150" height="72" fill="#171713"/><path d="M0 0H150M0 72H150M0 0V72M75 0V72" stroke="#7e6449" stroke-opacity=".18" stroke-width="4"/><path d="M2 5H70M82 5H145M2 67H70M82 67H145" stroke="#b08b60" stroke-opacity=".07" stroke-width="3"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/><rect width="1600" height="610" fill="url(#brick)"/>
