<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천하생존록 v8 에셋 갤러리</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b100d;color:#eee8d7;font-family:system-ui,-apple-system,sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{color:#d9b95f}.hint{color:#aaa48e;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{padding:14px;border:1px solid #5e5130;border-radius:14px;background:#111812}.card h2{font-size:17px;margin:0 0 4px}.card p{margin:0 0 10px;color:#aaa48e}.portrait{width:112px;height:112px;float:right;border-radius:12px;image-rendering:pixelated;border:1px solid #6a5b34}.sheet{width:100%;image-rendering:pixelated;background:#101611;border:1px solid #4b422a;border-radius:8px}.enemy{margin-top:30px}.back{display:inline-block;margin-top:20px;color:#f3d573}.spec{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}.spec span{padding:5px 8px;border:1px solid #5e5130;border-radius:999px;color:#d9b95f;font-size:12px}</style></head><body><main><h1>천하생존록 캐릭터 에셋 v8</h1><p class="hint">플레이어블 캐릭터는 프레임당 48×64px, 방향별 6프레임이다. 세로 행 순서는 정면·좌측·우측·후면이며, 캐릭터 오브젝트를 회전시키지 않고 행만 교체한다.</p><div class="spec"><span>48×64px</span><span>4방향</span><span>방향별 6프레임</span><span>192×192 초상화</span><span>픽셀 보간 제거</span></div><div id="grid" class="grid"></div><h1 class="enemy">적·보스 에셋</h1><p class="hint">적 에셋은 현재 32×40px 4프레임 규격을 유지한다. 플레이어 에셋과 별도 메타데이터로 렌더링된다.</p><div id="enemies" class="grid"></div><a class="back" href="index.html">← 게임으로 돌아가기</a></main><script>
const chars={sword:['백소린','화산검희'],spear:['연하진','철혈창군'],bow:['설아린','천산궁녀'],poison:['당유화','당문독희'],tao:['제갈청','천문도사'],saber:['마련화','녹림도후'],katana:['카구라 린','월영낭인'],fist:['소명진','금강권희']};
const grid=document.querySelector('#grid');for(const [id,[name,title]] of Object.entries(chars)){const card=document.createElement('article');card.className='card';card.innerHTML=`<img class="portrait" src="assets/portraits/${id}.png?v=8" alt="${name} 초상화"><h2>${name}</h2><p>${title} · ${id}<br>48×64 · 6프레임</p><img class="sheet" src="assets/characters/${id}.png?v=8" alt="${name} 스프라이트 시트">`;grid.appendChild(card)}
const names={bandit:'산적',spear:'창병',brute:'거한',master:'고수',assassin:'자객',blackblade:'흑도객',poisonhand:'독수귀',ironmonk:'철탑승',boss:'혈마'};const eg=document.querySelector('#enemies');for(const [id,name] of Object.entries(names)){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${name}</h2><p>${id}</p><img class="sheet" src="assets/enemies/${id}.png" alt="${name} 스프라이트 시트">`;eg.appendChild(card)}
</script></body></html>
