<g stroke="#4d4f49" stroke-width="8" fill="none" opacity=".65"><path d="M475 0v190"/><path d="M702 0v138"/></g>
<!-- foreground shadow -->
<path d="M0 620Q260 560 475 620T1200 610V700H0Z" fill="#030403" opacity=".84"/>
</svg>
