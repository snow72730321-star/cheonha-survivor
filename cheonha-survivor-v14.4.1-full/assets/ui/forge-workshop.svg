<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171713"/><stop offset="1" stop-color="#090b09"/></linearGradient>
 <radialGradient id="fire" cx="50%" cy="65%" r="42%"><stop offset="0" stop-color="#fff6b7"/><stop offset=".16" stop-color="#ffc15a"/><stop offset=".42" stop-color="#d95e22"/><stop offset=".78" stop-color="#42170d" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5aba9"/><stop offset=".22" stop-color="#555e5d"/><stop offset=".55" stop-color="#252c2c"/><stop offset=".82" stop-color="#77807c"/><stop offset="1" stop-color="#1a1f1e"/></linearGradient>
 <linearGradient id="wood" x1="0" x2="1"><stop stop-color="#2d1b11"/><stop offset=".5" stop-color="#724324"/><stop offset="1" stop-color="#24150e"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#wall)"/>
<rect x="0" y="510" width="1200" height="190" fill="#080908"/>
<g opacity=".28" stroke="#786649" stroke-width="4"><path d="M0 140H1200M0 275H1200M0 410H1200"/><path d="M130 0V510M340 0V510M575 0V510M850 0V510M1060 0V510"/></g>
<ellipse cx="610" cy="465" rx="340" ry="230" fill="url(#fire)" filter="url(#blur)" opacity=".75"/>
<!-- furnace -->
<path d="M62 530V220Q62 150 132 150H324Q390 150 390 220V530Z" fill="#17130f" stroke="#493826" stroke-width="10"/>
<path d="M118 510V287Q118 235 170 235H280Q334 235 334 287V510Z" fill="#090807" stroke="#6b4b2d" stroke-width="7"/>
<ellipse cx="226" cy="438" rx="100" ry="84" fill="url(#fire)"/>
<path d="M184 490Q206 383 226 490Q250 350 274 490" fill="#ff8d33" opacity=".9"/>
<!-- tool rack -->
<rect x="815" y="128" width="304" height="24" rx="9" fill="url(#wood)"/>
<g stroke="#747b78" stroke-width="12" stroke-linecap="round"><path d="M875 160v165"/><path d="M953 160v135"/><path d="M1034 160v178"/></g>
<g fill="#343b3a"><path d="M846 304h58l-8 30h-42z"/><path d="M927 279h52l-4 28h-44z"/><path d="M1000 319h68l-9 31h-50z"/></g>
<!-- work table -->
<path d="M715 455H1135L1090 510H755Z" fill="url(#wood)" stroke="#1d120d" stroke-width="8"/>
<rect x="778" y="504" width="34" height="160" fill="#2a190f"/><rect x="1038" y="504" width="34" height="160" fill="#2a190f"/>
<!-- central anvil -->
<g transform="translate(600 490)"><path d="M-178-45H82L170-12L83 28H55L72 136H-75L-55 28H-115L-205-9Z" fill="url(#metal)" stroke="#0a0d0c" stroke-width="11"/><path d="M-155-38H70" stroke="#d0d2cc" stroke-width="6" opacity=".35"/></g>
<!-- heated blade -->
<path d="M390 420L791 383L809 407L398 447Z" fill="#ddb65f" stroke="#fff1b0" stroke-width="4" opacity=".92"/>
<path d="M397 429L798 393" stroke="#fffbe4" stroke-width="5" opacity=".45"/>
